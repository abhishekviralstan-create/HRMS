<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · Attendance System</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eef8fb,#f5f7ff 55%,#e8f5f3);color:#172033;font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif}.shell{width:min(940px,100%);min-height:540px;display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border:1px solid #e1e8ef;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px #233b5c1f}.visual{position:relative;overflow:hidden;padding:54px;color:#fff;background:linear-gradient(150deg,#102b4c,#145d74 55%,#18a19b)}.visual:before,.visual:after{content:"";position:absolute;border-radius:50%;background:#ffffff13}.visual:before{width:390px;height:390px;right:-180px;top:-130px}.visual:after{width:260px;height:260px;left:-90px;bottom:-120px}.brand{position:relative;z-index:1;font-size:18px;font-weight:800;letter-spacing:.02em}.brand i{display:inline-block;width:10px;height:10px;margin-right:9px;border-radius:50%;background:#67f2ce;box-shadow:0 0 18px #67f2ce}.copy{position:relative;z-index:1;margin-top:120px}.copy small{font-size:11px;font-weight:800;letter-spacing:.14em;color:#a9eee3}.copy h1{max-width:370px;margin:12px 0;font:500 39px/1.15 Georgia,serif}.copy p{max-width:370px;margin:0;color:#d9f2f2}.formside{display:grid;align-content:center;padding:58px}.formside h2{margin:0 0 7px;font-size:27px}.sub{margin:0 0 30px;color:#6a7689}.field{display:block;margin:16px 0;color:#40506a;font-weight:700}.field span{display:block;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d5deea;border-radius:10px;font:inherit}.field input:focus{outline:3px solid #d9eff0;border-color:#15949b}.submit{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#167f8c;color:#fff;font:700 14px inherit;cursor:pointer}.submit:hover{background:#116e79}.submit:disabled{opacity:.65;cursor:wait}.error{min-height:22px;margin:12px 0 0;color:#c9323b;font-size:13px}.secure{margin-top:26px;color:#8591a2;font-size:12px}@media(max-width:720px){.shell{grid-template-columns:1fr;min-height:0}.visual{display:none}.formside{padding:38px 28px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="visual"><div class="brand"><i></i>AttendCRM</div><div class="copy"><small>WORKFORCE CONTROL</small><h1>Welcome back to your attendance workspace.</h1><p>Secure access to employee records, punch history and workforce reports.</p></div></section>
    <section class="formside">
      <h2>Sign in</h2><p class="sub">Enter your administrator credentials.</p>
      <form id="loginForm">
        <label class="field"><span>Email address</span><input id="email" type="email" autocomplete="username" required autofocus></label>
        <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
        <button class="submit" id="submit" type="submit">Sign in</button>
        <p class="error" id="error" role="alert"></p>
      </form>
      <p class="secure">Your session is protected with an HTTP-only cookie.</p>
    </section>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit',async(event)=>{event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;button.textContent='Signing in…';error.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Sign in failed');location.href='/overview'}catch(reason){error.textContent=reason.message;button.disabled=false;button.textContent='Sign in'}});
  </script>
</body>
</html>
